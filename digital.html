<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Argentina</title>

    <link rel="stylesheet" href="digital.css">
</head>

<body>

    <div class="app">

        <!-- ENCABEZADO -->
        <header class="topbar">

            <a href="index.html" class="back">
                ←
            </a>

           

        </header>


        <main class="container">

           


            <!-- CABECERA -->
            <div class="profile-header">

                <div>
                    <span class="small-text"></span>
                    <h2>Tobias Medina</h2>
                </div>


            </div>


            <!-- TARJETA PRINCIPAL -->
<section class="identity-card">

    <div class="document-image-container">
        <img
            src="prueba.png"
            alt="Documento de demostración"
            class="document-image"
        >
    </div>

    
</section>


            <!-- ACTUALIZACIÓN -->
            <div class="updated">

                Última actualización:
                <strong id="date"></strong>

            </div>


            <!-- ACCIONES -->
            <a href="#" class="action information-button" id="detailsButton">

    <img
        src="ojito.jpg"
        alt=""
        class="information-mini-image"
    >

    <span class="icon"></span>

    <span>Ver información</span>

    <span class="arrow">⌄</span>

</a>

<section class="actions">

    <!-- VER INFORMACIÓN -->
   

    <!-- INFORMACIÓN DESPLEGABLE -->
    <div class="details" id="details">

        <div class="detail">
            <span>Estado</span>
            <strong>Activo</strong>
        </div>

        <div class="detail">
            <span>Tipo</span>
            <strong>Documento digital demo</strong>
        </div>

        <div class="detail">
            <span>Identificador</span>
            <strong>DEMO-000000</strong>
        </div>

    </div>




<section class="actions">



    


    <!-- VERIFICACIÓN --><a  class="action verification-button" id="verificationButton">

    <span class="icon"></span>
        <img
        src="qrmini.jpg"
        alt="Verificación"
        class="verification-mini-image"
    >


    <span>Verificación</span>


    <span class="arrow">⌄</span>

</a>


    <!-- CONTENIDO OCULTO -->
    <div class="verification-content" id="verificationContent">

        <div class="verification-image">

            <img
                src="qr.PNG"
                alt="Imagen de demostración"
            >

        </div>

    </div>

</section>


            <!-- VOLVER -->
            <a href="index.html" class="return-button">
                Volver a documentos
            </a>

        </main>

    </div>


    <script src="digital.js"></script>

</body>
</html>
